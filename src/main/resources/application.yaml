
spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:file:./data/users-servicedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

server:
  port: 8081
